{{- if .Values.deployArgo }}
# Registers every supervisor namespace this instance manages, its own included.
# Rendered here because an entity must sit in the ArgoCD namespace. See docs/DECISIONS.md #24.
{{- range .Values.managedNamespaces }}
---
apiVersion: argocd-service.vsphere.vmware.com/v1alpha1
kind: ManagedEntity
metadata:
  name: supervisor-ns-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  targetRef:
    apiGroup: ""
    kind: Namespace
    name: {{ .name }}
    project: {{ .project }}
  clusterName: supervisor-ns-{{ .name }}
  secretLabels:
{{- range $k, $v := .labels }}
    {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
