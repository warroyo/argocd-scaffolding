# Identity the infra AppProject impersonates in this namespace (bare
# `argo-attach-sa` in destinationServiceAccounts). See docs/DECISIONS.md #24.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-attach-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-attach-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: argo-attach-sa
  namespace: {{ .Release.Namespace }}
