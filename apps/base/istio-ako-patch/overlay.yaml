apiVersion: v1
kind: Secret
metadata:
  name: istio-overlay-ako
  namespace: vmware-system-tkg
stringData:
  istio-overlay.yaml: |
    #@ load("@ytt:overlay", "overlay")

    #! AKO 2.2.1 with istioEnabled renders the pod's istio annotations and
    #! istio-certs volume itself; only the namespace label is left to add.
    #@overlay/match by=overlay.subset({"kind": "Namespace", "metadata": {"name": "avi-system"}})
    ---
    metadata:
      #@overlay/match missing_ok=True
      labels:
        #@overlay/match missing_ok=True
        istio-injection: enabled
---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '3'
    ext.packaging.carvel.dev/ytt-paths-from-secret-name.0: istio-overlay-ako
  # Placeholder prefix — the apps-side cluster-var-injector rewrites this to
  # <cluster_name>-ako from the `vars` ConfigMap, so the base is reusable
  # across clusters.
  name: cluster-ako
  namespace: vmware-system-tkg
  labels:
    config.k8s.io/inject-cluster-name-prefix: "true"