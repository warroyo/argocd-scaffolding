# Hand-applied only (Supervisor-admin kubectl) — never Terraform/GitOps.
# Registers Stakater's generic `application` chart so it can be installed as a
# VKS addon. Used by the argocd-attach-rbac addon to render the workload-cluster
# platform identity (SA + cluster-admin) that ArgoCD's cluster-apps impersonates.
# See docs/DECISIONS.md #14/#18, docs/GETTING-STARTED.md Part 1.2.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepository
metadata:
  name: stakater-application-repo
  namespace: vmware-system-vks-public
  annotations:
    # Required by the validating webhook; must mirror spec.version and
    # spec.addonFilters. Undocumented in the CRD — see docs/DECISIONS.md #14.
    addons.kubernetes.vmware.com/package-offerings: |
      {
        "repositoryVersion": "1.0.0",
        "packages": {
          "application": {
            "versions": ["9.0.0"]
          }
        }
      }
spec:
  targetRepositoryName: stakater-application-repo
  version: "1.0.0" # catalog-entry version, not the chart version
  fetch:
    helmRepository:
      url: https://stakater.github.io/stakater-charts
  addonFilters:
  - name: application
    versions:
    - "9.0.0"
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonRepositoryInstall
metadata:
  name: stakater-application-repo-install
  namespace: vmware-system-vks-public
spec:
  addonRepositoryRef:
    name: stakater-application-repo
    namespace: vmware-system-vks-public
