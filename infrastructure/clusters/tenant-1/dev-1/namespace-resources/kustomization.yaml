# Shared label-gated AddonInstalls for the tenant-1/dev-1 namespace. Synced once
# per namespace by the namespace-resources ApplicationSet. See CLAUDE.md "VKS add-ons".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../base/headlamp/install            # dev-only (envs/dev label)
- ../../../../base/istio/install               # standard add-on bundle
- ../../../../base/external-secrets/install    # standard add-on bundle
- ../../../../base/cert-manager/install        # standard add-on bundle
- ../../../../base/argocd-attach-rbac/install  # mandatory baseline (every cluster)
components:
# Version pins.
- ../../../../components/envs/dev/headlamp
- ../../../../components/envs/dev/istio
- ../../../../components/envs/dev/external-secrets
- ../../../../components/envs/dev/cert-manager
- ../../../../components/envs/dev/argocd-attach-rbac
