apiVersion: v1
kind: ConfigMap
metadata:
  name: vars
  annotations:
    config.kubernetes.io/local-config: 'true'
data:
  cluster_name: dev1-cluster   # must equal this directory name
  project: tenant-1            # must equal the {project} directory & cluster label
  namespace_ref: dev-1         # must equal the {namespace_ref} directory & cluster label
  # Headlamp UI host (Gateway/AVI programs the DNS record). Adjust to the lab's
  # AVI DNS domain — hostname-ownership policy allows the .will-org-apps.vcf.lab suffix.
  headlamp_hostname: headlamp-dev1-cluster.acme.gpu.set.lab
