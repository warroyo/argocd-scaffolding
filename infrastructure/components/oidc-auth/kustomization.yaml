# Opt-in: accept VCFA tokens at this cluster's apiserver (structured
# AuthenticationConfiguration) so a user can paste the bearer their vcf CLI
# already mints into Headlamp. Issuer + CA + audience are ORG-global — one VCFA
# org's identity plane, shared by every cluster it hosts — so they live directly
# here, NOT per-env (env never selects the identity plane; the org/VCFA does).
# Multi-org (a separate TF run per org) re-keys these per org — see docs/BACKLOG.md.
# Design: docs/ARCHITECTURE.md "VCFA identity"; rationale: docs/DECISIONS.md #21.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
- target:
    group: cluster.x-k8s.io
    version: v1beta1
    kind: Cluster
  patch: |-
    # variables/1 is the `kubernetes` entry in base/vks-cluster/cluster.yaml.
    # Adding this rolls the control plane once — see docs/DECISIONS.md #21.
    - op: add
      path: /spec/topology/variables/1/value/apiServerConfiguration
      value:
        extraAuthentication:
          jwt:
          - issuer:
              # VCFA OIDC issuer — must match the token's `iss` byte-for-byte.
              url: https://auto.gpu.set.lab/oidc
              # VCFA portal/API client the vcf CLI's token carries (org-global).
              # Prod would mint a dedicated k8s aud — see docs/DECISIONS.md #21.
              audiences:
              - 922f4a12-82c9-4440-8466-f1b1faca0675
              # PEM (not base64), every root that may sign the issuer. A CA roll
              # APPENDS the successor here — never edit in place (rolls the CP).
              certificateAuthority: |
