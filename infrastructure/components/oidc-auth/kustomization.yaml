            claimMappings:
              # No prefix: Kubernetes uses the expression result verbatim, so
              # this matches Concierge's vcf CLI path — one identity, one set of
              # RBAC subjects. MUST stay byte-identical to the JWTAuthenticator
              # in base/argocd-attach-rbac/config (validate.sh parity check).
              username:
                expression: 'claims.preferred_username'
              groups:
                expression: 'claims.?groups.orValue([]) + claims.?roles.orValue([])'
            # Restores the guard the username prefix would otherwise have given.
            userValidationRules:
            - expression: '!user.username.startsWith("system:")'
              message: "username must not use the system: prefix"
