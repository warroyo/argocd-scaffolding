# Dev argocd-attach-rbac version pin — the dayzero AddonRelease name (the
# Carvel package refName.version, verify with `kubectl -n
# vmware-system-vks-public get addonrelease | grep dayzero` after registering
# supervisor-addons/dayzero.yaml), included by a namespace's namespace-resources
# after base/argocd-attach-rbac/install. See CLAUDE.md "Rolling a version".
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
- target:
    group: addons.kubernetes.vmware.com
    version: v1alpha1
    kind: AddonInstall
    labelSelector: "app.kubernetes.io/name=argocd-attach-rbac"
  patch: |-
    - op: replace
      path: /spec/releaseFilter/ref/name
      value: "dayzero.kubernetes.vmware.com.1.0.3" # dayzero-addon-service release (1.0.3+ = ${CLUSTER_NAME}/${CLUSTER_UID} substitution)
