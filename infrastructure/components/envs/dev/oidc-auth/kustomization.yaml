# Dev VCFA issuer + CA for the opt-in oidc-auth component. Included by a cluster
# right after components/oidc-auth (env values can't come from envs/dev itself —
# that runs inside profiles/dev, before the cluster's own components).
# See CLAUDE.md "Rolling a version".
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
- target:
    group: cluster.x-k8s.io
    version: v1beta1
    kind: Cluster
    labelSelector: "gitops.platform/oidc-auth=enabled"
  patch: |-
    - op: replace
      path: /spec/topology/variables/1/value/apiServerConfiguration/extraAuthentication/jwt/0/issuer/url
      value: "https://auto.gpu.set.lab/oidc" # Dev VCFA OIDC issuer
    # Env-shared audience = the VCFA client the vcf CLI's token carries (verified
    # live via kind: aud=922f4a12 authenticates as the VCFA user). See docs/DECISIONS.md.
    - op: replace
      path: /spec/topology/variables/1/value/apiServerConfiguration/extraAuthentication/jwt/0/issuer/audiences/0
      value: "922f4a12-82c9-4440-8466-f1b1faca0675" # Dev VCFA portal/API client
    # Append the successor root here before a CA roll — never edit in place, an
    # apiserver edit rolls the control plane.
    - op: replace
      path: /spec/topology/variables/1/value/apiServerConfiguration/extraAuthentication/jwt/0/issuer/certificateAuthority
      value: |
        -----BEGIN CERTIFICATE-----
