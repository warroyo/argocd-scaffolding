# Optional config — headlamp is fine on defaults, so this ships only via the
# opt-in components/headlamp-config (CLAUDE.md "Add-on config"). Only exposes the
# UI through Gateway API; headlamp itself does NO OIDC. The bearer login path
# (apiserver-side components/oidc-auth) is parked — see docs/BACKLOG.md.
# hostname is injected from cluster-details.yaml (headlamp_hostname).
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: cluster-headlamp
  labels:
    app.kubernetes.io/name: headlamp
    config.k8s.io/inject-cluster-name-prefix: "true"
spec:
  values:
    # Gateway routing + certificate SANs.
    hostname: replacemehost
    gatewayApi:
      enabled: true
      gateway:
        # Default GatewayClass = AVI/AKO (default-on every cluster); AKO
        # registers the DNS record when the Gateway programs. Gateway API has no
        # is-default-class, so this is an explicit default value. A NON-AKO
        # cluster running headlamp overrides className per-cluster (patches:,
        # target by app.kubernetes.io/name=headlamp) to its own gateway class
        # (e.g. istio). See docs/GETTING-STARTED.md "Headlamp SSO".
        className: avi-lb
        create: true
        name: headlamp-gateway
