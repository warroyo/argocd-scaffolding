# Optional config — headlamp is fine on defaults, so this ships only via the
# opt-in components/headlamp-config (CLAUDE.md "Add-on config"). Only exposes the
# UI through Gateway API; headlamp itself does NO OIDC. Users authenticate by
# pasting the VCFA bearer their vcf CLI already mints (scripts/headlamp-token.sh),
# which the apiserver accepts via the oidc-auth component. hostname is injected
# from cluster-details.yaml (headlamp_hostname). See docs/ARCHITECTURE.md "VCFA identity".
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: cluster-headlamp
  labels:
    app.kubernetes.io/name: headlamp
    config.k8s.io/inject-cluster-name-prefix: "true"
spec:
  values:
    # Gateway routing + certificate SANs.
    hostname: replacemehost
    gatewayApi:
      enabled: true
      gateway:
        # AVI/AKO handles north-south ingress here, not istio (the schema
        # default). AKO registers the DNS record when the Gateway programs.
        className: avi-lb
        create: true
        name: headlamp-gateway
