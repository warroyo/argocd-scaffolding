# Required config — the day-zero payload for this cluster's mandatory identity:
# ONE ClusterRoleBinding granting cluster-admin to default:argo-attach-sa (no SA
# object; RBAC/impersonation are string-based). Name "cluster-dayzero" is
# injector-prefixed to <cluster>-dayzero, the fixed name the dayzero addon
# (github.com/warroyo/dayzero-addon-service) itself requires for config/cluster
# pairing — a future add-on sharing dayzero on this cluster must add its
# resources to this same list. See docs/DECISIONS.md #18.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: cluster-dayzero
  annotations:
    # Required by the dayzero addon, else this AddonConfig outlives the ClusterAddon.
    clusteraddon.addons.kubernetes.vmware.com/owned-for-deletion: "true"
  labels:
    app.kubernetes.io/name: argocd-attach-rbac
    config.k8s.io/inject-cluster-name-prefix: "true"
spec:
  values:
    resources:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: argocd-attach-cluster-admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
      # bare `argo-attach-sa` resolves here (cluster-apps sync destination);
      # the SA object itself need not exist — impersonation is string-based.
      - kind: ServiceAccount
        name: argo-attach-sa
        namespace: default
    # Pinniped Concierge authenticator for VCFA identity — the vcf CLI path.
    # Replaces `vcf ... register-vcfa-jwt-authenticator`: kapp-controller
    # reconciles it continuously, so it self-heals if the CLI is re-run. Issuer
    # + CA are env values. Never touch tkg-jwt-authenticator (kapp-managed by
    # the platform). See docs/ARCHITECTURE.md "VCFA identity".
    - apiVersion: authentication.concierge.pinniped.dev/v1alpha1
      kind: JWTAuthenticator
      metadata:
        # Name is fixed by the vcf CLI (hardcoded, not a kubeconfig flag) —
        # renaming breaks CLI login. docs/ARCHITECTURE.md "VCFA identity".
        name: tm-vks-jwt-authenticator
      spec:
        issuer: replace-me
        # Audience is <CAPI cluster name>-<CAPI cluster UID>; dayzero 1.0.3+
        # substitutes both at apply time.
        audience: ${CLUSTER_NAME}-${CLUSTER_UID}
        claims:
          # These expressions are the identity contract for the vcf CLI path.
          # The parked apiserver bearer path must match them byte-for-byte when
          # it returns (docs/BACKLOG.md), or the two paths yield different subjects.
          usernameExpression: 'claims.preferred_username'
          groupsExpression: 'claims.?groups.orValue([]) + claims.?roles.orValue([])'
        tls:
          certificateAuthorityData: replace-me
